# Docker profile configuration
server.port=8080
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/eventsphere_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.thymeleaf.cache=true
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.eventsphere=${LOGGING_LEVEL_COM_EVENTSPHERE:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SPRING_SECURITY:WARN}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:WARN}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:WARN}

file.upload-dir=/app/uploads/
