<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | EventSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
    <header class="modern-header">
        <a class="brand" th:href="@{/}"><span class="brand-mark">ES</span><span>EventSphere</span></a>
        <nav class="modern-nav">
            <a th:href="@{/events}">Events</a>
            <a th:href="@{/about}">About</a>
            <a class="active" th:href="@{/contact}">Contact</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/dashboard}">Dashboard</a>
        </nav>
    </header>
    <main class="section active page-shell narrow-page">
        <span class="eyebrow">Contact</span>
        <h1>Need help with EventSphere?</h1>
        <p class="lead">Use the deployment README for environment setup, or reach the campus platform administrator for account access and role changes.</p>
        <div class="info-card">
            <h2>Support channel</h2>
            <p>Email: support@eventsphere.com</p>
            <p>Default admin: admin@eventsphere.com</p>
        </div>
    </main>
</body>
</html>
