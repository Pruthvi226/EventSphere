<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a12">
    <meta name="robots" content="index, follow">
    <!-- SEO: page-specific title/description injected by each template -->
    <title th:replace="~{::title}">EventSphere</title>
    <meta name="description" th:if="${metaDescription}" th:content="${metaDescription}">
    <meta name="description" th:unless="${metaDescription}" content="EventSphere – Campus event management platform for student registrations, attendance, certificates and more.">
    <!-- Open Graph -->
    <meta property="og:site_name" content="EventSphere">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${pageTitle ?: 'EventSphere – Campus Event Platform'}">
    <meta property="og:description" th:content="${metaDescription ?: 'Manage campus events end-to-end: registrations, attendance, certificates and analytics.'}">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <div class="confetti-container" id="confettiContainer"></div>
    <main th:fragment="page-content">
        <!-- Content goes here -->
    </main>
    <form id="logoutForm" th:action="@{/logout}" method="POST" style="display:none;"></form>
    <script th:src="@{/static/js/app.js}"></script>
</body>
</html>
