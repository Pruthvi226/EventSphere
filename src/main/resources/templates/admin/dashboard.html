<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EventSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/"><i class="fas fa-lock"></i> EventSphere Admin</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/users">Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="/" onclick="document.getElementById('logoutForm').submit(); return false;">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <h1>Admin Dashboard</h1>
        <p class="text-muted">System Overview and Management</p>

        <!-- Statistics -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-users fa-2x text-primary mb-2"></i>
                        <h6 class="text-muted mb-1">Total Users</h6>
                        <h3 th:text="${totalUsers}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-graduation-cap fa-2x text-success mb-2"></i>
                        <h6 class="text-muted mb-1">Students</h6>
                        <h3 th:text="${totalStudents}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-chalkboard-user fa-2x text-info mb-2"></i>
                        <h6 class="text-muted mb-1">Organizers</h6>
                        <h3 th:text="${totalOrganizers}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <i class="fas fa-handshake fa-2x text-warning mb-2"></i>
                        <h6 class="text-muted mb-1">Volunteers</h6>
                        <h3 th:text="${totalVolunteers}">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Management Section -->
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <a href="/admin/users" class="btn btn-primary me-2">
                            <i class="fas fa-users"></i> Manage Users
                        </a>
                        <a href="#" class="btn btn-info me-2">
                            <i class="fas fa-chart-bar"></i> View Reports
                        </a>
                        <a href="#" class="btn btn-success">
                            <i class="fas fa-cog"></i> System Settings
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container text-center">
            <p>&copy; 2024 EventSphere Admin Panel. All rights reserved.</p>
        </div>
    </footer>

    <form id="logoutForm" th:action="@{/logout}" method="POST" style="display:none;"></form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
