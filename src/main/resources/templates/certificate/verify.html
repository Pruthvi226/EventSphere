<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate | EventSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
    <header class="modern-header">
        <a class="brand" th:href="@{/}"><span class="brand-mark">ES</span><span>EventSphere</span></a>
        <nav class="modern-nav">
            <a th:href="@{/events}">Events</a>
            <a class="active" th:href="@{/certificate-verify}">Verify</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/dashboard}">Dashboard</a>
        </nav>
    </header>
    <main class="section active page-shell narrow-page">
        <span class="eyebrow">Certificate verification</span>
        <h1>Check a certificate number.</h1>
        <form class="search-card wide" th:action="@{/certificate-verify}" method="get">
            <input class="form-input" name="certificateNumber" th:value="${certificateNumber}" placeholder="CERT-20260526-ABC123" required>
            <button class="btn btn-primary" type="submit">Verify</button>
        </form>

        <div class="alert alert-success" th:if="${verified == true}">
            Certificate verified for <strong th:text="${certificate.studentName}">Student</strong>
            on <strong th:text="${certificate.eventTitle}">Event</strong>.
        </div>
        <div class="alert alert-danger" th:if="${verified == false}">
            No certificate was found for that number.
        </div>
    </main>
</body>
</html>
