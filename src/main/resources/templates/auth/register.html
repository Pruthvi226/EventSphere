<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your free EventSphere account and start registering for campus events, tracking attendance and earning verifiable certificates.">
    <meta name="robots" content="noindex, nofollow">
    <title>Create account | EventSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body class="auth-body">
    <div class="nebula-glow nebula-1"></div>
    <div class="nebula-glow nebula-2"></div>
    <div class="nebula-glow nebula-3"></div>
    <main class="section active auth-modern">
        <section class="auth-copy">
            <a class="brand auth-brand" th:href="@{/}">
                <span class="brand-mark">ES</span>
                <span>EventSphere</span>
            </a>
            <h1>Create your student account.</h1>
            <p>Start registering for published campus events. Admins can promote accounts to organizer or volunteer roles from user management.</p>
        </section>

        <section class="auth-card">
            <h2>Register</h2>
            <p>Your account is enabled immediately after registration.</p>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}">Registration failed.</div>

            <form class="modern-form" th:action="@{/auth/register}" th:object="${userDTO}" method="post">
                <label>
                    <span>Full name</span>
                    <input class="form-input" th:field="*{fullName}" type="text" autocomplete="name" placeholder="Asha Sharma" required>
                    <small class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
                </label>
                <label>
                    <span>Email address</span>
                    <input class="form-input" th:field="*{email}" type="email" autocomplete="email" placeholder="asha@college.edu" required>
                    <small class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </label>
                <label>
                    <span>Password</span>
                    <input class="form-input" th:field="*{password}" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" required>
                    <small class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                </label>
                <button class="btn btn-primary btn-lg" type="submit">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a th:href="@{/auth/login}">Sign in</a></p>
        </section>
    </main>
    <script th:src="@{/static/js/app.js}"></script>
</body>
</html>
