<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates | EventSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a class="sidebar-logo" th:href="@{/dashboard}">EventSphere</a>
            <nav class="sidebar-section">
                <a class="sidebar-link" th:href="@{/student/dashboard}">Dashboard</a>
                <a class="sidebar-link" th:href="@{/events}">Browse events</a>
                <a class="sidebar-link" th:href="@{/student/my-registrations}">My registrations</a>
                <a class="sidebar-link active" th:href="@{/student/certificates}">Certificates</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <div><div class="topbar-title">Certificates</div><div class="topbar-subtitle">Download issued certificates and verify numbers publicly.</div></div>
                <a class="btn btn-secondary" th:href="@{/certificate-verify}">Verify number</a>
            </div>
            <section class="event-card-grid" th:if="${!#lists.isEmpty(certificates)}">
                <article class="info-card" th:each="certificate : ${certificates}">
                    <span class="badge badge-primary" th:text="${certificate.certificateType}">TYPE</span>
                    <h2 th:text="${certificate.eventTitle}">Event</h2>
                    <p th:text="'Issued to ' + ${certificate.studentName}">Student</p>
                    <p class="mono" th:text="${certificate.certificateNumber}">CERT</p>
                    <a class="btn btn-primary btn-sm" th:href="@{/certificates/{id}/download(id=${certificate.id})}">Download PDF</a>
                </article>
            </section>
            <div class="empty-state" th:if="${#lists.isEmpty(certificates)}">
                <h3>No certificates yet</h3>
                <p>Certificates appear after an organizer marks attendance and generates them.</p>
            </div>
        </main>
    </div>
</body>
</html>
