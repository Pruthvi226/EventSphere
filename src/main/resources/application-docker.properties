# Docker profile configuration
server.port=${SERVER_PORT:${PORT:8080}}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/eventsphere_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventsphere}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventsphere}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.eventsphere=${LOGGING_LEVEL_COM_EVENTSPHERE:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SPRING_SECURITY:WARN}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:WARN}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:WARN}

file.upload-dir=/app/uploads/
app.seed.enabled=${APP_SEED_ENABLED:true}
