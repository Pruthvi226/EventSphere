name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Maven Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

      - name: Package application
        run: mvn -B -ntp -DskipTests package
